name: Deploy to AWS with Terraform
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # Required for repository checkout
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using IAM user
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # 4. Terraform Init
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=my-innovatemart-terraform-state" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=eu-west-1" \
            -backend-config="dynamodb_table=terraform-lock" || exit 1

      # 5. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -lock=true -out=tfplan || exit 1

      # 6. Upload Terraform Plan (for debugging)
      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 5

      # 7. Terraform Apply
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: terraform apply -lock=true -auto-approve tfplan || exit 1

      # 8. Configure kubectl for EKS
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region eu-west-1 --name bedrock-eks
        env:
          AWS_DEFAULT_REGION: eu-west-1

    name: Deploy to EKS
on:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::073186739637:role/github-actions-terraform-role
        aws-region: eu-west-1
    - name: Deploy to EKS
      run: |
        aws eks update-kubeconfig --name bedrock-eks --region eu-west-1
        kubectl apply -f k8s/namespace-retail.yaml
        kubectl apply -f k8s/mysql-secret.yaml
        kubectl apply -f k8s/mysql-deployment.yaml
        kubectl apply -f k8s/mysql-service.yaml
        kubectl apply -f k8s/ui-deployment.yaml
        kubectl apply -f k8s/ui-service.yaml
        kubectl apply -f k8s/ui-ingress.yaml
