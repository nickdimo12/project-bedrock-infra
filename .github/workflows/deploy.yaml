name: Deploy to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials (via OIDC)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::073186739637:role/github-actions-terraform-role
          aws-region: eu-west-1

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # 4. Terraform Init
      - name: Terraform Init
        run: |
          cd infra
          terraform init -input=false \
            -backend-config="bucket=my-innovatemart-terraform-state" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=eu-west-1" \
            -backend-config="dynamodb_table=terraform-lock"

      # 5. Terraform Plan
      - name: Terraform Plan
        run: |
          cd infra
          terraform plan -input=false -lock=false -out=tfplan -var-file=terraform.tfvars

      # 6. Terraform Apply (only on push to main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd infra
          terraform apply -input=false -auto-approve tfplan

      # 7. Configure kubectl for EKS
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region eu-west-1 --name bedrock-eks

      # 8. Deploy Kubernetes manifests
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace-retail.yaml
          kubectl apply -f k8s/mysql-secret.yaml
          kubectl apply -f k8s/mysql-deployment.yaml
          kubectl apply -f k8s/mysql-service.yaml
          kubectl apply -f k8s/ui-deployment.yaml
          kubectl apply -f k8s/ui-service.yaml
