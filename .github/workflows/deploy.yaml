name: Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::073186739637:role/github-actions-terraform-role
          aws-region: eu-west-1

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # 4. Terraform Init
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=my-innovatemart-terraform-state" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=eu-west-1" \
            -backend-config="dynamodb_table=terraform-lock"

      # 5. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -lock=true -out=tfplan

      # 6. Upload Terraform Plan (for debugging)
      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 5

      # 7. Terraform Apply
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: terraform apply -lock=true -auto-approve tfplan

      # 8. Configure kubectl for EKS
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region eu-west-1 --name bedrock-eks

      # 9. Deploy Kubernetes manifests
      - name: Deploy manifests to EKS
        run: |
          kubectl apply -f k8s/namespace-retail.yaml
          kubectl apply -f k8s/mysql-secret.yaml
          kubectl apply -f k8s/mysql-deployment.yaml
          kubectl apply -f k8s/mysql-service.yaml
          kubectl apply -f k8s/ui-deployment.yaml
          kubectl apply -f k8s/ui-service.yaml
          kubectl apply -f k8s/ui-ingress.yaml
